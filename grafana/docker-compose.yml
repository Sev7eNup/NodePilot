# NodePilot monitoring stack: Prometheus scraping the API host + Grafana with
# pre-provisioned dashboards.
#
# Prerequisites:
#   - NodePilot API running with OpenTelemetry:Enabled=true and
#     OpenTelemetry:Exporters:PrometheusScrape=true (exposes /metrics on port 5000)
#
# Setup:
#   cp .env.example .env   # then set a password
#   docker compose up -d
#
# Grafana:    http://localhost:3000  (admin / password from .env)
# Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container reach the NodePilot API running on the Docker host (Windows/macOS).
      # On Linux set NODEPILOT_HOST=<host-ip> in .env and reference it in prometheus.yml.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Read from a NodePilot-specific variable so an .env without it fails closed
      # instead of starting Grafana with a known default password.
      GF_SECURITY_ADMIN_PASSWORD: "${NODEPILOT_GRAFANA_ADMIN_PASSWORD:?NODEPILOT_GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
