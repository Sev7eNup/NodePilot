name: Secret scan

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (all reachable history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out all reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ARCHIVE_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary_dir="$RUNNER_TEMP/gitleaks-bin"
          download_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" "$download_url"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict

          mkdir --parents "$binary_dir"
          tar --extract --gzip --file "$archive" --directory "$binary_dir" gitleaks
          "$binary_dir/gitleaks" version
          printf 'GITLEAKS_BIN=%s/gitleaks\n' "$binary_dir" >> "$GITHUB_ENV"

      - name: Verify GitHub token rules fail closed
        shell: bash
        run: |
          set -euo pipefail

          # Build synthetic, high-entropy tokens only inside ephemeral repositories.
          # Token prefixes are deliberately split in this tracked workflow so the
          # self-test itself never becomes a finding in NodePilot history.
          assert_detected() {
            local label="$1"
            local prefix="$2"
            local body_length="$3"
            local probe body seed status

            probe="$(mktemp --directory "$RUNNER_TEMP/gitleaks-probe.XXXXXX")"
            seed='aB3dE5gH7jK9mN2pQ4sT6vW8yZ0cD1fG'
            body=''
            while (( ${#body} < body_length )); do
              body+="$seed"
            done
            body="${body:0:body_length}"

            git -C "$probe" init --quiet
            git -C "$probe" config user.name "Secret Scanner Self-Test"
            git -C "$probe" config user.email "secret-scanner@example.invalid"
            printf 'credential=%s%s\n' "$prefix" "$body" > "$probe/fixture.txt"
            git -C "$probe" add fixture.txt
            git -C "$probe" commit --quiet --message "synthetic secret fixture"

            set +e
            "$GITLEAKS_BIN" git \
              --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
              --redact=100 --no-banner --no-color --log-level error \
              "$probe" >/dev/null 2>&1
            status=$?
            set -e

            if (( status != 1 )); then
              echo "::error::Gitleaks did not fail closed for $label (exit $status)."
              exit 1
            fi
          }

          underscore='_'
          assert_detected "classic personal access tokens" "ghp${underscore}" 36
          assert_detected "fine-grained personal access tokens" "github${underscore}pat${underscore}" 82
          assert_detected "OAuth access tokens" "gho${underscore}" 36
          assert_detected "user-to-server tokens" "ghu${underscore}" 36
          assert_detected "server-to-server tokens" "ghs${underscore}" 36
          assert_detected "refresh tokens" "ghr${underscore}" 36

      - name: Scan every reachable commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "::error::Secret scan refuses to run on a shallow clone."
            exit 1
          fi

          commit_count="$(git rev-list --all --count)"
          if (( commit_count == 0 )); then
            echo "::error::No reachable commits were available to scan."
            exit 1
          fi
          echo "Scanning $commit_count commits reachable from fetched refs."

          "$GITLEAKS_BIN" git \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --log-opts="--all --full-history" \
            --redact=100 --no-banner --no-color --log-level warn \
            --timeout 600 \
            "$GITHUB_WORKSPACE"
