name: Docs site

# Publishes the documentation SPA (src/nodepilot-docs-ui) to GitHub Pages at
# https://sev7enup.github.io/NodePilot/.
#
# One-time manual step: in Settings, under Pages, set Build and deployment Source to
# "GitHub Actions". No workflow can do it: actions/configure-pages has an `enablement` input,
# but it needs a token other than GITHUB_TOKEN (a PAT with repo scope, or a GitHub App with
# administration:write). Until that switch is set, deploy-pages fails with a 404 naming the
# settings URL.
#
# configure-pages is deliberately not used. Its only other job is injecting a base path for a
# known SSG, and it recognises nuxt, next, gatsby and sveltekit only, not Vite. The docs site
# builds location-independent: `base: './'` emits relative asset URLs and the app uses
# HashRouter, so every route lives in the fragment and the server only serves
# /NodePilot/index.html. No 404.html SPA fallback is needed either.
on:
  push:
    branches: [main]
    # Only the docs package can change what gets published. A backend-only commit would
    # otherwise redeploy a byte-identical site on every push to main.
    paths:
      - 'src/nodepilot-docs-ui/**'
      - '.github/workflows/docs-pages.yml'
  # Manual re-deploy: useful after enabling Pages for the first time, and after a failed run
  # whose cause was fixed outside this repository.
  workflow_dispatch:

# The repository's default workflow token is read-only, so every permission a Pages
# deployment needs has to be named here.
permissions:
  contents: read
  pages: write
  id-token: write

# A single global queue for Pages. cancel-in-progress stays false so a deployment already
# writing to the live site finishes instead of being killed halfway by a newer push.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: src/nodepilot-docs-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-docs-ui/package-lock.json

      - name: Install
        run: npm ci

      # ci.yml already gates every PR with lint and the de/en corpus parity guard. The tests
      # run again here because this job is the last check before the live site is updated.
      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/nodepilot-docs-ui/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
