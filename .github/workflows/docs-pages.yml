name: Pages redirects

# The full website is published separately with deploy/Publish-Site.ps1.
# Pages forwards old links to the matching page on www.nodepilot.run.
on:
  push:
    branches: [main]
    paths:
      - 'src/nodepilot-docs-ui/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy redirects
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: src/nodepilot-docs-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-docs-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm run test:run
      - name: Build redirects
        run: npm run build:pages-redirects
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/nodepilot-docs-ui/_pages-redirects
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
