name: SignPath test signing

on:
  workflow_dispatch:
  push:
    branches: [build/signpath-onboarding]
    paths:
      - .github/workflows/signpath-test.yml
      - deploy/signpath/switcher-zip.xml

permissions:
  contents: read

concurrency:
  group: signpath-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-switcher:
    if: >-
      github.repository == 'Sev7eNup/NodePilot' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/signpath-onboarding')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test Switcher
        run: dotnet test tests/NodePilot.Switcher.Tests -c Release

      - name: Build unsigned Switcher
        run: >-
          dotnet publish src/NodePilot.Switcher/NodePilot.Switcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:ContinuousIntegrationBuild=true -p:DebugType=None
          -o artifacts/unsigned

      - name: Upload unsigned executable as ZIP
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodepilot-switcher-unsigned-test
          path: artifacts/unsigned/NodePilot.Switcher.exe
          if-no-files-found: error
          retention-days: 7

      - name: Submit to SignPath test policy
        id: signing
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: e64c0f9b-346e-4e60-bce6-8791970f5567
          project-slug: NodePilot
          signing-policy-slug: test-signing
          artifact-configuration-slug: switcher-zip
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed

      - name: Verify test signature and record evidence
        timeout-minutes: 5
        env:
          SIGNING_REQUEST_URL: ${{ steps.signing.outputs.signing-request-web-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'This test must run on an ephemeral GitHub-hosted runner.'
          }
          $expectedThumbprint = '1E3876C87EF8D2B73F940F80674D5B81C2AA3649'
          $signedPath = Join-Path $PWD 'artifacts/signed/NodePilot.Switcher.exe'
          Write-Output 'Reading the returned Authenticode signature.'
          $signature = Get-AuthenticodeSignature -LiteralPath $signedPath
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) {
            throw 'The returned executable is not signed by the expected SignPath test certificate.'
          }

          # The machine store avoids interactive current-user root-store confirmation dialogs.
          # Trust only the pinned certificate on this disposable GitHub-hosted runner.
          $certificateStore = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
          $certificateStore.Open('ReadWrite')
          try {
            Write-Output 'Temporarily trusting the pinned test certificate on the disposable runner.'
            $certificateStore.Add($signature.SignerCertificate)
            Write-Output 'Verifying the signed executable.'
            $verified = Get-AuthenticodeSignature -LiteralPath $signedPath
            if ($verified.Status -ne 'Valid') {
              throw "Authenticode verification failed: $($verified.Status) - $($verified.StatusMessage)"
            }
          } finally {
            Write-Output 'Removing the temporary test certificate.'
            $certificateStore.Remove($signature.SignerCertificate)
            $certificateStore.Close()
          }

          $hash = (Get-FileHash -LiteralPath $signedPath -Algorithm SHA256).Hash
          "$hash  NodePilot.Switcher.exe" | Set-Content artifacts/signed/SHA256SUMS.txt -Encoding ASCII
          @(
            'SignPath Foundation onboarding test; not a production release.'
            "Source commit: $env:GITHUB_SHA"
            "Request: $env:SIGNING_REQUEST_URL"
            "Signer SHA-1 thumbprint: $expectedThumbprint"
            "Signed executable SHA-256: $hash"
            'Authenticode verification: Valid with the pinned self-signed test certificate.'
          ) | Set-Content artifacts/signed/signing-evidence.txt -Encoding ASCII
          Get-Content artifacts/signed/signing-evidence.txt | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload verified test result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodepilot-switcher-signed-test
          path: artifacts/signed/
          if-no-files-found: error
          retention-days: 14
