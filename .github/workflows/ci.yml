name: CI

on:
  # main is gated unconditionally: every commit that lands on the default branch gets a full CI
  # run, no matter how it got there. A merge commit re-tests the tree its PR run already covered;
  # that duplication is accepted so direct pushes and release cuts do not depend on someone
  # triggering `workflow_dispatch`. The local nightly suite is no substitute: it runs against its
  # checked-out tree, never pulls, and is not an origin/main status check.
  #   - CodeQL keeps its own `push: [main]` trigger: only a run on the default branch
  #     updates the repository's code-scanning dashboard.
  pull_request:
    branches: [main, master]
  push:
    branches: [main]
  workflow_dispatch:

# Within one branch the newest run wins; the PR/main duplication above is unaffected, because a
# pull request and a push to main key on different groups.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only superseded pull request runs are cancelled. A push to main always finishes, so a release
  # commit keeps its own green result even when the version bump lands minutes later.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the code-only jobs have anything to do, so a documentation-only pull
  # request does not spend job-minutes proving that nothing changed.
  #
  # Deliberately narrow. Only jobs that provably cannot read documentation are gated:
  # frontend, desktop and e2e. Backend and docs-ui always run, because markdown is an input
  # to them: DocumentationCountsTests reads README.md, CLAUDE.md, docs/mcp-server.md and six
  # pages of the doc site; MonitoringDeploymentSecurityTests reads README.md and
  # grafana/README.md; the doc-site parity guard reads content/{de,en}. A blanket
  # `paths-ignore: ['**/*.md']` would wave through the README breakages those tests catch.
  #
  # Pull requests only. A push to main, whether a merge, a direct commit or a release cut,
  # always gets the full suite, because that is the branch everything else is measured against.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    # Counted from job start, not from queue entry: a busy runner pool must not turn a pull
    # request red. These are runaway guards, not budgets — each sits well above the measured
    # runtime so only a hung step trips them.
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: filter
        shell: bash
        run: |
          # Deliberately not `set -e`. A gated job is skipped when this one fails, so an error
          # in the detection would silently remove coverage. Every failure path below therefore
          # ends at code=true: if the change cannot be proven documentation-only, run everything.
          set -uo pipefail

          decide() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "=> $2"; exit 0; }

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            decide true "not a pull request (push or manual) — running every job"
          fi

          # Fetch the base branch explicitly rather than trusting the checkout's default
          # refspec to have produced origin/<base>.
          if ! git fetch --no-tags --prune origin \
                 "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"; then
            decide true "could not fetch the base branch — running every job to be safe"
          fi

          base="$(git merge-base HEAD "origin/${{ github.base_ref }}" 2>/dev/null || true)"
          if [[ -z "$base" ]]; then
            decide true "no merge base against ${{ github.base_ref }} — running every job to be safe"
          fi

          changed="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          if [[ -z "$changed" ]]; then
            decide true "could not determine the changed files — running every job to be safe"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Anything that is not a markdown file or a documentation image counts as code.
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/images/)'; then
            decide true "non-documentation changes present — running every job"
          fi

          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "=> documentation only — skipping frontend, desktop and e2e."
          echo "   Backend and docs-ui still run: markdown is an input to both."

  backend:
    name: Backend build + tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        # setup-dotnet's built-in `cache: true` is not usable here: it requires a
        # packages.lock.json, and Directory.Packages.props deliberately keeps floating
        # latest-in-band pins that a lock file would freeze.
        #
        # The same key is used in codeql.yml. Caches are repository-wide, so one warm entry
        # serves both workflows — the CodeQL C# build currently pays for its own cold restore.
        #
        # Explicit globs rather than '**/*.csproj': a '**' would also walk out/ and every
        # bin/obj tree that happens to be in the checkout.
        #
        # Consequence worth naming: when a floating pin resolves to a new minor, restore pulls
        # just that package over the network and the cache is not rewritten (the key still
        # hits). Bump the v1 epoch to discard the cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ hashFiles('global.json', 'dotnet-tools.json', 'Directory.Packages.props', 'Directory.Build.props', 'src/**/*.csproj', 'tests/**/*.csproj') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-

      - name: Enforce patched .NET SDK policy
        shell: pwsh
        run: |
          . ./scripts/Assert-DotnetSdkPolicy.ps1
          Assert-NodePilotDotnetSdkPolicy -RepoRoot $PWD

      - name: Restore
        run: dotnet restore

      - name: Reject vulnerable NuGet dependencies
        shell: pwsh
        run: |
          $auditJson = & dotnet list NodePilot.slnx package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet package vulnerability audit failed with exit code $LASTEXITCODE."
          }
          $report = $auditJson | ConvertFrom-Json -ErrorAction Stop
          $vulnerable = @(
            foreach ($project in @($report.projects)) {
              foreach ($framework in @($project.frameworks)) {
                $packages = @($framework.topLevelPackages) + @($framework.transitivePackages)
                foreach ($package in $packages) {
                  $advisories = @($package.vulnerabilities | Where-Object { $null -ne $_ })
                  if ($null -ne $package -and $advisories.Count -gt 0) {
                    $package
                  }
                }
              }
            }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | ConvertTo-Json -Depth 8
            throw "NuGet vulnerability audit found $($vulnerable.Count) vulnerable package entries."
          }

      - name: Deployment security contracts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .\deploy\Test-DeploymentTemplates.ps1
          .\deploy\Test-ArtifactSecurity.ps1
          .\deploy\Test-SetupAdapter.ps1
          .\deploy\Test-MachinePath.ps1

      - name: Deployment security contracts (PowerShell 7)
        shell: pwsh
        run: |
          .\deploy\Test-ArtifactSecurity.ps1
          .\deploy\Test-SetupAdapter.ps1
          .\deploy\Test-MachinePath.ps1

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Restore local tools (reportgenerator)
        run: dotnet tool restore

      - name: Test with coverage
        # --settings applies coverage.runsettings, which excludes EF migrations and
        # [ExcludeFromCodeCoverage]-attributed code from the denominator. It is the same filter
        # the documented local measurement uses, so both report the same number.
        # The trx logger gets no LogFileName on purpose: a fixed name makes every test project
        # write the same file into the shared results directory, leaving only the last one in
        # the uploaded artifact. VSTest's default name is per-run unique and keeps all of them.
        run: dotnet test --configuration Release --no-build --settings coverage.runsettings --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Generate coverage report
        if: always()
        # -assemblyfilters mirrors the local measurement documented in
        # docs/claude-reference.md. Without it the test scaffolding (NodePilot.TestCommons,
        # NodePilot.LoadTests) counts as production code. The +np and +nodepilot-mcp entries
        # are required: the CLI assembly is named `np` and the MCP server `nodepilot-mcp`, so
        # a plain NodePilot.* filter drops both.
        run: dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"Html;Cobertura;TextSummary" "-assemblyfilters:+NodePilot.*;+np;+nodepilot-mcp;-NodePilot.*.Tests;-NodePilot.TestCommons;-NodePilot.LoadTests"

      - name: Enforce minimum coverage
        shell: pwsh
        run: |
          # The floors sit a few points below the coverage the suite currently reaches, so the
          # gate tolerates normal churn but fails on a step-change regression. Raise them as
          # the suite grows; do not lower them without a written reason. Branch coverage is
          # gated as well: it is the more informative of the two, and a regression usually
          # shows up there first.
          $minLineCoverage = 85
          $minBranchCoverage = 70
          [xml]$cov = Get-Content coverage-report/Cobertura.xml
          $linePct = [math]::Round([double]$cov.coverage.'line-rate' * 100, 2)
          $branchPct = [math]::Round([double]$cov.coverage.'branch-rate' * 100, 2)
          Write-Host "Backend line coverage:   $linePct% (required minimum: $minLineCoverage%)"
          Write-Host "Backend branch coverage: $branchPct% (required minimum: $minBranchCoverage%)"
          $failed = $false
          if ($linePct -lt $minLineCoverage) {
            Write-Error "Backend line coverage $linePct% is below the required minimum of $minLineCoverage%."
            $failed = $true
          }
          if ($branchPct -lt $minBranchCoverage) {
            Write-Error "Backend branch coverage $branchPct% is below the required minimum of $minBranchCoverage%."
            $failed = $true
          }
          if ($failed) { exit 1 }

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          # Not '**/*.trx': on Windows that glob walks every bin/ and obj/ tree in the repo and
          # picks up stale files from earlier local runs. The test step writes only into
          # TestResults/ via --results-directory.
          path: TestResults/**/*.trx

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-report
          path: coverage-report/

  frontend:
    name: Frontend build + tests
    # Its tests read CSS, TypeScript and package.json, never markdown.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/nodepilot-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Reject vulnerable npm dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        # Ratchet: errors always fail, and warnings are capped at the current count (react-
        # compiler "incompatible library" skips plus legacy exhaustive-deps), so any new
        # warning fails the run. Drive the cap toward 0 as the residual warnings are cleaned
        # up. A compiler or plugin upgrade can raise the count without new code being added;
        # in that case the cap moves rather than the ratchet being removed.
        run: npm run lint:ci

      - name: Type check + build
        run: npm run build

      - name: Tests with coverage
        # Coverage thresholds live in vitest.config.ts; this fails the run if the line,
        # statement, branch or function rate drops below the floor configured there.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-report
          path: src/nodepilot-ui/coverage/

  docs-ui:
    name: Docs UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/nodepilot-docs-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-docs-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Reject vulnerable npm dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        # docs-ui is warning-clean, so the cap is 0 and any new warning fails the run.
        run: npm run lint:ci

      - name: Tests
        # Language routing plus the de/en corpus parity guard: a page or nav title added in
        # only one language fails here instead of returning 404 for half the readers.
        run: npm run test:run

      - name: Type check + build
        run: npm run build

  desktop:
    name: Desktop shell typecheck + tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/nodepilot-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Reject vulnerable npm dependencies
        # Fail closed. The packaging tree deliberately excludes Electron Forge and the legacy
        # extract-zip package; package-contract tests keep that boundary explicit.
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npm run typecheck

      - name: Tests
        # Pure-logic units only (desktop.json handoff validation, certificate pinning,
        # navigation containment). No Electron runtime is needed, hence ubuntu, not windows.
        run: npm run test:run

  e2e:
    name: Frontend E2E (Playwright) ${{ matrix.shard }}/4
    # Hermetic specs against the built SPA with every API mocked; nothing here reads a
    # documentation file. It is the longest job in the workflow, so the one worth gating.
    #
    # Playwright shards by test GROUP (file), not by individual test. Files hold between one
    # and sixteen tests, so expect the shards to come out uneven; the slowest one sets the job
    # duration.
    #
    # Each shard builds the SPA itself via the webServer block. That looks wasteful next to the
    # `frontend` job, but the four builds run CONCURRENTLY — together they cost one build of
    # wall-clock. A shared build job would serialise its own `npm ci` in front of all of them
    # and come out slower.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Load-bearing for ci-gate: with fail-fast the surviving shards report `cancelled`
      # instead of their own result, and the gate could not tell a real failure from a
      # cascade.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: src/nodepilot-ui
    env:
      # Two workers per shard on a four-vCPU runner. The specs carry no shared state: every API
      # call is intercepted per test with page.route(), and no spec uses serial mode or a
      # beforeAll fixture. Set to '1' if parallelism ever shows up as flake.
      PW_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        # The resolved version from node_modules, not the ^-range in package.json: the cache
        # key has to change when the actual browser build does.
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        # setup-node's npm cache does not cover ~/.cache/ms-playwright.
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        # The cache holds the browser, not the apt packages it links against.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        # blob instead of html: a single shard's HTML report is useless on its own, blob files
        # can be merged. `github` stays — those are the inline PR annotations.
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=blob,github

      - name: Upload blob report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: src/nodepilot-ui/blob-report/
          retention-days: 3

  e2e-report:
    name: Playwright report (merged)
    # Deliberately NOT in ci-gate.needs, and listed in the gate's exemption list: this job
    # renders no verdict, it only assembles an artifact. Inside the gate it would add its own
    # runtime to the critical path and hold up auto-merge for a report nobody reads on a green
    # run.
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/nodepilot-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: src/nodepilot-ui/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: src/nodepilot-ui/playwright-report/

  # The single required status check on main.
  #
  # Why an aggregator instead of requiring the jobs directly: frontend, desktop and e2e hang off
  # `if: needs.changes.outputs.code == 'true'`. A skipped job reports no status at all, so a
  # documentation-only pull request would leave those required checks on "Expected — waiting for
  # status" forever and auto-merge would never fire. This job always runs and translates skipped
  # into green.
  #
  # COUPLED TO REPO SETTINGS: the `name:` below is the context string the branch protection rule
  # on main requires. Renaming it leaves every pull request waiting on a context that never
  # appears again. Change the protection rule first, then this name.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [backend, changes, desktop, docs-ui, e2e, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report every dependency result
        shell: bash
        # docs-ui needs bracket syntax: in a GitHub expression `needs.docs-ui` parses as a
        # subtraction, not a property lookup.
        run: |
          echo 'changes  = ${{ needs.changes.result }}'
          echo 'backend  = ${{ needs.backend.result }}'
          echo 'frontend = ${{ needs.frontend.result }}'
          echo "docs-ui  = ${{ needs['docs-ui'].result }}"
          echo 'desktop  = ${{ needs.desktop.result }}'
          echo 'e2e      = ${{ needs.e2e.result }}'

      - name: Guard - every job in this workflow is wired into the gate
        shell: bash
        # Without this, a newly added job that nobody lists in `needs` is never checked and the
        # required status check goes green anyway. yq v4 is preinstalled on ubuntu runners.
        #
        # Exemptions are only for jobs that render no verdict. Adding one means accepting that
        # its failure cannot fail the gate.
        run: |
          set -euo pipefail
          exempt='^(ci-gate|e2e-report)$'
          declared="$(yq -r '.jobs | keys | .[]' .github/workflows/ci.yml | grep -Ev "$exempt" | sort)"
          wired="$(yq -r '.jobs.ci-gate.needs[]' .github/workflows/ci.yml | sort)"
          if [[ "$declared" != "$wired" ]]; then
            echo "::error::ci-gate.needs is out of sync with the job list in ci.yml."
            diff <(echo "$declared") <(echo "$wired") || true
            exit 1
          fi
          echo "Every job is wired into the gate:"
          printf '%s\n' "$wired" | sed 's/^/  /'

      - name: Fail if any job failed or was cancelled
        # `skipped` counts as success — that is the documentation-only path. Two things in the
        # gated jobs are load-bearing for this to be correct: no `continue-on-error` on any of
        # them (it would launder a failure into success), and `fail-fast: false` on any matrix,
        # so a sibling shard reports its own failure instead of `cancelled`.
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
