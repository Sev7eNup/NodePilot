name: CI

on:
  # main is gated unconditionally: every commit that lands on the default branch gets a full CI
  # run, no matter how it got there. A merge commit does re-test the tree its PR run already
  # covered (~35 job-minutes per change, both runs drawing on the same runner pool) — that
  # duplication is accepted deliberately, because the alternative leaves direct pushes and
  # release cuts resting on a `workflow_dispatch` nobody is forced to trigger. The local nightly
  # suite is not a substitute: it runs against its currently checked-out tree and never pulls,
  # so it is not an origin/main status check.
  #   - CodeQL keeps its own `push: [main]` trigger: only a run on the default branch
  #     updates the repository's code-scanning dashboard.
  pull_request:
    branches: [main, master]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Decides whether the code-only jobs have anything to do. A pull request that moves
  # documentation around used to spend ~40 job-minutes proving that nothing changed.
  #
  # Deliberately narrow. Only jobs that provably cannot read documentation are gated:
  # frontend, desktop and e2e. **Backend and docs-ui always run**, because markdown is an
  # input to them — DocumentationCountsTests reads README.md, CLAUDE.md, docs/mcp-server.md
  # and six pages of the doc site; MonitoringDeploymentSecurityTests reads README.md and
  # grafana/README.md; the doc-site parity guard reads content/{de,en}. A blanket
  # `paths-ignore: ['**/*.md']` would have waved through exactly the README breakages this
  # CI caught while the README was being cut down.
  #
  # Pull requests only. A push to main — a merge, a direct commit, a release cut — always
  # gets the full suite, because that is the branch everything else is measured against.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: filter
        shell: bash
        run: |
          # Deliberately NOT `set -e`. A gated job is skipped when this one fails, so an error
          # in the detection would silently remove coverage — the one outcome worth engineering
          # out. Every failure path below therefore ends at code=true: if we cannot prove the
          # change is documentation-only, we run everything.
          set -uo pipefail

          decide() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "=> $2"; exit 0; }

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            decide true "not a pull request (push or manual) — running every job"
          fi

          # Fetch the base branch explicitly rather than trusting the checkout's default
          # refspec to have produced origin/<base>.
          if ! git fetch --no-tags --prune origin \
                 "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"; then
            decide true "could not fetch the base branch — running every job to be safe"
          fi

          base="$(git merge-base HEAD "origin/${{ github.base_ref }}" 2>/dev/null || true)"
          if [[ -z "$base" ]]; then
            decide true "no merge base against ${{ github.base_ref }} — running every job to be safe"
          fi

          changed="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          if [[ -z "$changed" ]]; then
            decide true "could not determine the changed files — running every job to be safe"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Anything that is not a markdown file or a documentation image counts as code.
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/images/)'; then
            decide true "non-documentation changes present — running every job"
          fi

          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "=> documentation only — skipping frontend, desktop and e2e."
          echo "   Backend and docs-ui still run: markdown is an input to both."

  backend:
    name: Backend build + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Enforce patched .NET SDK policy
        shell: pwsh
        run: |
          . ./scripts/Assert-DotnetSdkPolicy.ps1
          Assert-NodePilotDotnetSdkPolicy -RepoRoot $PWD

      - name: Restore
        run: dotnet restore

      - name: Reject vulnerable NuGet dependencies
        shell: pwsh
        run: |
          $auditJson = & dotnet list NodePilot.slnx package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet package vulnerability audit failed with exit code $LASTEXITCODE."
          }
          $report = $auditJson | ConvertFrom-Json -ErrorAction Stop
          $vulnerable = @(
            foreach ($project in @($report.projects)) {
              foreach ($framework in @($project.frameworks)) {
                $packages = @($framework.topLevelPackages) + @($framework.transitivePackages)
                foreach ($package in $packages) {
                  $advisories = @($package.vulnerabilities | Where-Object { $null -ne $_ })
                  if ($null -ne $package -and $advisories.Count -gt 0) {
                    $package
                  }
                }
              }
            }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | ConvertTo-Json -Depth 8
            throw "NuGet vulnerability audit found $($vulnerable.Count) vulnerable package entries."
          }

      - name: Deployment security contracts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .\deploy\Test-DeploymentTemplates.ps1
          .\deploy\Test-ArtifactSecurity.ps1
          .\deploy\Test-SetupAdapter.ps1
          .\deploy\Test-MachinePath.ps1

      - name: Deployment security contracts (PowerShell 7)
        shell: pwsh
        run: |
          .\deploy\Test-ArtifactSecurity.ps1
          .\deploy\Test-SetupAdapter.ps1
          .\deploy\Test-MachinePath.ps1

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Restore local tools (reportgenerator)
        run: dotnet tool restore

      - name: Test with coverage
        # --settings applies coverage.runsettings (excludes EF migrations and
        # [ExcludeFromCodeCoverage]-attributed code from the denominator) — the same filter
        # the local measurement uses. Previously CI measured without it, so the enforced
        # number and the documented measurement procedure disagreed.
        # The trx logger gets no LogFileName on purpose: every test project in the solution wrote
        # the same test_results.trx into the shared results directory, so each one overwrote its
        # predecessor and the uploaded artifact held a single project's results. VSTest's default
        # name is per-run unique, which keeps all of them.
        run: dotnet test --configuration Release --no-build --settings coverage.runsettings --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Generate coverage report
        if: always()
        # -assemblyfilters mirrors the documented local measurement exactly. Without it the test
        # scaffolding itself (NodePilot.TestCommons, NodePilot.LoadTests) counted as production
        # code, so the gated number and the procedure in docs/claude-reference.md disagreed.
        # The two +np / +nodepilot-mcp entries are not optional: the CLI assembly is named `np`
        # and the MCP server `nodepilot-mcp`, so a plain NodePilot.* filter drops both.
        run: dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"Html;Cobertura;TextSummary" "-assemblyfilters:+NodePilot.*;+np;+nodepilot-mcp;-NodePilot.*.Tests;-NodePilot.TestCommons;-NodePilot.LoadTests"

      - name: Enforce minimum coverage
        shell: pwsh
        run: |
          # Floors sit ~5pp below the values measured on 2026-07-27 (line 89.0%, branch 74.1%)
          # so the gate tolerates normal churn but fails on a step-change regression. Raise
          # them as the suite grows; do not lower without a written reason.
          #
          # The line floor was 45 until 2026-07-27 — the 2026-04-26 baseline, by then 44pp
          # below reality. At that distance the gate could not fail on anything short of
          # deleting most of the suite, which is the one thing it exists to catch.
          # Branch coverage is gated too: it is the more informative of the two, and a
          # regression usually shows there first.
          $minLineCoverage = 85
          $minBranchCoverage = 70
          [xml]$cov = Get-Content coverage-report/Cobertura.xml
          $linePct = [math]::Round([double]$cov.coverage.'line-rate' * 100, 2)
          $branchPct = [math]::Round([double]$cov.coverage.'branch-rate' * 100, 2)
          Write-Host "Backend line coverage:   $linePct% (required minimum: $minLineCoverage%)"
          Write-Host "Backend branch coverage: $branchPct% (required minimum: $minBranchCoverage%)"
          $failed = $false
          if ($linePct -lt $minLineCoverage) {
            Write-Error "Backend line coverage $linePct% is below the required minimum of $minLineCoverage%."
            $failed = $true
          }
          if ($branchPct -lt $minBranchCoverage) {
            Write-Error "Backend branch coverage $branchPct% is below the required minimum of $minBranchCoverage%."
            $failed = $true
          }
          if ($failed) { exit 1 }

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: '**/*.trx'

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-report
          path: coverage-report/

  frontend:
    name: Frontend build + tests
    # Its tests read CSS, TypeScript and package.json — never markdown. Verified, not assumed.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/nodepilot-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Reject vulnerable npm dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        # Ratchet: errors always fail; warnings are capped at the current floor (13 —
        # 5 react-compiler "incompatible library" skips + 8 legacy exhaustive-deps) so any
        # NEW warning fails the run. Drive the cap toward 0 as the residual deps are cleaned.
        # Was 11 until the eslint 9→10 bump (needed to clear the brace-expansion advisory,
        # which forced eslint-plugin-react-hooks 7.0→7.1): the newer compiler pass recognises
        # two more TanStack useVirtualizer call sites as unmemoizable. Same library, same
        # diagnostic — no new code, so the floor moved rather than the ratchet breaking.
        run: npm run lint:ci

      - name: Type check + build
        run: npm run build

      - name: Tests with coverage
        # Coverage thresholds live in vitest.config.ts; this fails the run if the line/
        # statement/branch/function rate drops below the floor configured there.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-report
          path: src/nodepilot-ui/coverage/

  docs-ui:
    name: Docs UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/nodepilot-docs-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-docs-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Reject vulnerable npm dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        # docs-ui is warning-clean today — capped at 0 so any new warning fails the run.
        run: npm run lint:ci

      - name: Tests
        # Language routing plus the de/en corpus parity guard: a page or nav title added in
        # one language only fails here rather than 404-ing for half the readers.
        run: npm run test:run

      - name: Type check + build
        run: npm run build

  desktop:
    name: Desktop shell typecheck + tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/nodepilot-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Reject vulnerable npm dependencies
        # Fail closed. The packaging tree deliberately excludes Electron Forge and the legacy
        # extract-zip package; package-contract tests keep that boundary explicit.
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npm run typecheck

      - name: Tests
        # Pure-logic units only (desktop.json handoff validation, certificate pinning,
        # navigation containment). No Electron runtime — hence ubuntu, not windows.
        run: npm run test:run

  e2e:
    name: Frontend E2E (Playwright)
    # Hermetic specs against the built SPA with every API mocked; nothing here reads a
    # documentation file. The single longest job in the workflow, so the one worth gating.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/nodepilot-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/nodepilot-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        # ~200 MB download on every run — there is deliberately NO browser cache step here
        # (setup-node's npm cache does not cover ~/.cache/ms-playwright). Add actions/cache
        # keyed on the playwright version if this ever becomes the bottleneck.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: src/nodepilot-ui/playwright-report/
