version: 2

# Five update blocks (nuget + three npm roots + github-actions). NuGet resolves through
# Central Package Management, so every bump lands in Directory.Packages.props rather than
# in individual csproj files.
#
# Editing this file re-runs every block right away, independent of the Monday schedule, and
# opens new collective PRs within minutes. Batch config edits into one change instead of
# merging them one after another.
#
# PR-budget policy (see CLAUDE.md): every block bundles its minor and patch updates into one
# collective PR and carries open-pull-requests-limit: 1. That bounds the collective PRs at
# five, one per block, but it is not a cap of five overall: the groups below declare
# update-types [minor, patch] only, so every pending major falls outside them and arrives as
# its own PR.
#
# Majors stay ungrouped on purpose. Bundling them lowers the PR count but makes the review
# worse, because a breaking change inside a bundle can pass CI unnoticed.
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    # Known-incompatible upgrades, each verified against this codebase; do not re-offer.
    # Microsoft.OpenApi 3.x breaks the OpenAPI pipeline. Spectre.Console has to move as a
    # family: Spectre.Console.Cli's stable line stops at 0.55.0 and pins Spectre.Console to
    # that version, so bumping the other packages pairs a newer core with a CLI built against
    # 0.55 (see the comment in Directory.Packages.props). Lift this when Spectre.Console.Cli
    # 1.0 ships.
    #
    # The floor is >0.55.0 rather than >=0.56.0 because Spectre.Console, .Json and .Testing
    # publish 0.55.1 and 0.55.2 while Spectre.Console.Cli and .Cli.Testing stop at 0.55.0;
    # a >=0.56.0 floor would still allow the same family split inside the patch range.
    #
    # WireMock.Net 2.16.0 pulls Microsoft.OpenApi 3.10.2 transitively (through
    # WireMock.Net.OpenApiParser -> RamlToOpenApiConverter -> Microsoft.OpenApi.YamlReader),
    # which collides with the 2.x floor above and fails restore with NU1605. Lift it together
    # with the Microsoft.OpenApi entry, once Swashbuckle majors.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
      - dependency-name: "Spectre.Console*"
        versions: [">0.55.0"]
      - dependency-name: "WireMock.Net"
        versions: [">=2.16.0"]
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/src/nodepilot-ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    # TypeScript 7 is a verified-incompatible major: the typescript-eslint peer range caps at
    # the previous major, so npm ci fails with ERESOLVE. Same rule on all three npm roots.
    #
    # jsdom 30.1.0 breaks the four BackupPage tests that post a FormData body through msw:
    # the request never resolves and each case times out. Reproduced locally against 30.1.0
    # with everything else unchanged. Lift it when msw handles the new FormData behaviour.
    #
    # @vitest/coverage-v8 5.x pins its peer to the exact vitest version, so it can only move
    # with the family. The family move itself was tried: vitest 5 runs all three roots green
    # on its own, but in the full src/nodepilot-ui run it exposes cross-file pollution that
    # fails ExecutionsPage, which passes in isolation and on vitest 4. That is a migration,
    # not a bump. Lift both entries together when someone takes it on.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/src/nodepilot-docs-ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    # vitest moves as a family across all three roots; see the note on the nodepilot-ui block.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Electron shell: archive extraction and packaging dependencies are exact-pinned because
  # package-contract tests enforce the hardened, Forge-free packaging boundary.
  - package-ecosystem: npm
    directory: "/src/nodepilot-desktop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    # vitest moves as a family across all three roots; see the note on the nodepilot-ui block.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Actions bump majors routinely, so everything is bundled into one PR; the SHA-pinned
    # usages keep the diff reviewable regardless of the size of the version jump.
    groups:
      actions-all:
        patterns:
          - "*"
