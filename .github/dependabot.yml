version: 2

# Four package ecosystems (nuget + three npm roots), feeding the five CI jobs. NuGet resolves through Central Package
# Management, so every bump lands in Directory.Packages.props rather than in individual
# csproj files. Grouped so a framework bump arrives as one reviewable PR instead of a dozen.
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Known-incompatible upgrades, each verified against this codebase — do not re-offer:
    # Microsoft.OpenApi 3.x breaks the OpenAPI pipeline; Spectre.Console 0.57.x breaks the
    # CLI rendering stack. Revisit deliberately, not via routine bumps.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
      - dependency-name: "Spectre.Console"
        versions: [">=0.57.0"]
      - dependency-name: "Spectre.Console.Json"
        versions: [">=0.57.0"]
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "FluentAssertions"
          - "Moq"
          - "NBomber*"

  - package-ecosystem: npm
    directory: "/src/nodepilot-ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # TypeScript 7 is a verified-incompatible major (typescript-eslint peer range caps at
    # the previous major; ERESOLVE on npm ci). Same rule on all three npm roots.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "eslint*"
          - "typescript*"

  - package-ecosystem: npm
    directory: "/src/nodepilot-docs-ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Electron shell: package.json pins three overrides into Forge's own tree (see the
  # "//overrides" note there). Review those before accepting a Forge bump.
  - package-ecosystem: npm
    directory: "/src/nodepilot-desktop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
