version: 2

# Five update blocks (nuget + three npm roots + github-actions). NuGet resolves through
# Central Package Management, so every bump lands in Directory.Packages.props rather than
# in individual csproj files.
#
# PR-budget policy (see CLAUDE.md): at most 5 Dependabot PRs exist at any time — every
# block bundles its minor+patch updates into ONE collective PR and carries
# open-pull-requests-limit: 1, so majors queue behind the collective PR instead of fanning
# out. The first live run in 2026-08 opened 21 individual PRs at once; that noise level is
# deliberately not allowed to repeat. (Note: any edit to this file makes Dependabot
# re-run every block and supersede open singles with the collective PRs.)
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    # Known-incompatible upgrades, each verified against this codebase — do not re-offer:
    # Microsoft.OpenApi 3.x breaks the OpenAPI pipeline. Spectre.Console must move as a
    # FAMILY: Spectre.Console.Cli's stable line stops at 0.55.0 and pins Spectre.Console to
    # its own version, so any bump of the other packages pairs a newer core with a CLI built
    # against 0.55 — on a 0.x library that is a real risk (see the comment in
    # Directory.Packages.props). The wildcard and the 0.56.0 floor are both deliberate: the
    # previous rule named only Spectre.Console and Spectre.Console.Json at >=0.57.0, which
    # let a grouped run bump the core to 0.56.0 and Spectre.Console.Testing to 0.57.2 while
    # the CLI stayed at 0.55.0. Lift this when Spectre.Console.Cli 1.0 ships.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
      - dependency-name: "Spectre.Console*"
        versions: [">=0.56.0"]
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/src/nodepilot-ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    # TypeScript 7 is a verified-incompatible major (typescript-eslint peer range caps at
    # the previous major; ERESOLVE on npm ci). Same rule on all three npm roots.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/src/nodepilot-docs-ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Electron shell: package.json pins three overrides into Forge's own tree (see the
  # "//overrides" note there). Review those before accepting a Forge bump.
  - package-ecosystem: npm
    directory: "/src/nodepilot-desktop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Actions bump majors routinely (checkout v4→v7 etc.) — bundle EVERYTHING into one PR;
    # the SHA-pinned usages make the diff reviewable regardless of semver jump size.
    groups:
      actions-all:
        patterns:
          - "*"
