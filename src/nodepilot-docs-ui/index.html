<!doctype html>
<!-- Static lang value for crawlers and readers without JavaScript; English is the site
     default (src/i18n/languages.ts DEFAULT_LANG). App.tsx overwrites it per navigation
     once the bundle runs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="docs-favicon" rel="icon" type="image/png" href="./src/assets/logo-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)" />
    <title>NodePilot Documentation — Agentless Windows Workflow Orchestration</title>
    <meta
      name="description"
      content="NodePilot documentation: agentless workflow orchestration for Windows over WinRM — an open, modern replacement for Microsoft System Center Orchestrator."
    />

    <!-- One generic link-preview card for the whole site: routes live in the URL fragment
         (#/en/cli), which never reaches the server, so every page returns this same HTML and
         crawlers cannot see per-page tags. For the same reason there is no hreflang pair and
         no sitemap. og:url and canonical carry no fragment. og:image must be an absolute
         https URL; a relative one yields no card image on most platforms. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NodePilot Docs" />
    <meta property="og:title" content="NodePilot Documentation" />
    <meta
      property="og:description"
      content="Agentless workflow orchestration for Windows over WinRM — an open replacement for System Center Orchestrator."
    />
    <meta property="og:url" content="https://sev7enup.github.io/NodePilot/" />
    <meta property="og:image" content="https://sev7enup.github.io/NodePilot/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NodePilot — agentless Windows workflow orchestration" />
    <!-- twitter:card is the only twitter:* tag needed; title, description and image are
         inherited from og:*. twitter:site and twitter:creator need a real handle, so they
         are omitted. -->
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://sev7enup.github.io/NodePilot/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Resolve the theme before first paint, otherwise dark-mode users see a white flash.
         Must stay a classic (non-module) inline script; a module would be deferred and the
         flash returns. useTheme seeds its state from the class this sets. -->
    <script>
      try {
        var t =
          localStorage.getItem('np-docs-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        /* private mode / storage disabled — fall through to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
